    <script>
      // Suppress Vite HMR WebSocket connection errors inside sandboxed iframe preview
      window.addEventListener('unhandledrejection', function(event) {
        var reason = event && event.reason;
        var msg = typeof reason === 'string' ? reason : (reason && reason.message) || '';
        if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('websocket') !== -1) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      });
      window.addEventListener('error', function(event) {
        var msg = event && (event.message || event);
        if (typeof msg === 'string' && (msg.indexOf('WebSocket') !== -1 || msg.indexOf('websocket') !== -1)) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      });
    </script>
