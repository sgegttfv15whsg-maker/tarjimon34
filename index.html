    <script>
      (function() {
        // 1. Suppress any unhandled rejection or error event related to WebSocket or Vite HMR
        function isWsError(err) {
          if (!err) return false;
          var msg = (typeof err === 'string' ? err : (err.message || (err.reason && (err.reason.message || err.reason)))) || '';
          if (typeof msg !== 'string') return false;
          var lower = msg.toLowerCase();
          return lower.indexOf('websocket') !== -1 || msg.indexOf('[vite]') !== -1;
        }

        window.addEventListener('unhandledrejection', function(event) {
          if (isWsError(event.reason) || isWsError(event)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('error', function(event) {
          if (isWsError(event.error) || isWsError(event.message) || isWsError(event)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);

        // 2. Mock Vite's HMR WebSocket so it stays open and never throws errors or fails in iframe
        if (typeof window !== 'undefined' && window.WebSocket) {
          var NativeWebSocket = window.WebSocket;
          window.WebSocket = function(url, protocols) {
            var isViteHmr = false;
            if (typeof protocols === 'string' && protocols.indexOf('vite') !== -1) isViteHmr = true;
            if (Array.isArray(protocols) && protocols.some(function(p) { return typeof p === 'string' && p.indexOf('vite') !== -1; })) isViteHmr = true;
            if (typeof url === 'string' && (url.indexOf('vite') !== -1 || url.indexOf('localhost:3000') !== -1 || url.indexOf('ais-') !== -1)) isViteHmr = true;

            if (isViteHmr) {
              var dummy = {
                binaryType: 'blob',
                bufferedAmount: 0,
                extensions: '',
                protocol: 'vite-hmr',
                readyState: 1, // WebSocket.OPEN
                url: url,
                onopen: null,
                onclose: null,
                onerror: null,
                onmessage: null,
                send: function() {},
                close: function() {},
                addEventListener: function(event, handler) {
                  if (event === 'open' && typeof handler === 'function') {
                    setTimeout(handler, 10);
                  }
                },
                removeEventListener: function() {},
                dispatchEvent: function() { return true; }
              };
              setTimeout(function() {
                if (typeof dummy.onopen === 'function') {
                  dummy.onopen({ type: 'open' });
                }
              }, 10);
              return dummy;
            }

            try {
              var ws = new NativeWebSocket(url, protocols);
              ws.addEventListener('error', function(e) {
                // Prevent bubbling of ws errors
              });
              return ws;
            } catch (e) {
              return {
                readyState: 3,
                send: function() {},
                close: function() {},
                addEventListener: function() {},
                removeEventListener: function() {},
                dispatchEvent: function() { return true; }
              };
            }
          };

          window.WebSocket.prototype = NativeWebSocket.prototype;
          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
        }
      })();
    </script>
    <style>
      vite-error-overlay {
        display: none !important;
      }
    </style>
